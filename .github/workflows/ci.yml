name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DOMAIN: opentroop.test
  APP_SECRET: this-is-a-dummy-secret-for-ci-testing-purposes-only # gitleaks:allow
  CORS_ORIGINS: '["http://localhost:3000"]'

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run python -m mypy app

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Test (pytest + coverage)
        run: uv run pytest -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 14
  rls-tests:
    name: Postgres RLS tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opentroop_rls_test
          POSTGRES_USER: opentroop_owner
          POSTGRES_PASSWORD: opentroop
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    env:
      DATABASE_URL: postgresql+psycopg://opentroop_owner:opentroop@localhost:5433/opentroop_rls_test
      PG_TEST_URL: postgresql+psycopg://opentroop_owner:opentroop@localhost:5433/opentroop_rls_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Apply migrations (creates roles + RLS policies)
        run: uv run alembic upgrade head
      - name: Run RLS tests
        run: uv run pytest -m pg -v --no-cov

  migration-check:
    name: Migration drift check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opentroop_test
          POSTGRES_USER: opentroop
          POSTGRES_PASSWORD: opentroop
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+psycopg://opentroop:opentroop@localhost:5432/opentroop_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check for drift
        run: uv run alembic check

  frontend:
    name: Frontend (lint, type-check, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter web lint

      - name: Type check (tsc)
        run: pnpm --filter web type-check

      - name: Test (vitest)
        run: pnpm --filter web test:run

      - name: Dependency vulnerability scan (pnpm audit)
        run: pnpm audit --prod --audit-level high

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
