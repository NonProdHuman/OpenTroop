name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}
  REGION: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}
  AR_REPO: ${{ vars.GCP_ARTIFACT_REPOSITORY || vars.AR_REPO || 'opentroop-containers' }}
  API_SERVICE: ${{ vars.GCP_API_SERVICE_NAME || vars.API_SERVICE_NAME || 'opentroop-api' }}
  WEB_SERVICE: ${{ vars.GCP_WEB_SERVICE_NAME || vars.WEB_SERVICE_NAME || 'opentroop-web' }}
  DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || vars.ENVIRONMENT || 'production' }}
  PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.API_PUBLIC_URL || '' }}
  BACKEND_IMAGE: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}/${{ vars.GCP_ARTIFACT_REPOSITORY || vars.AR_REPO || 'opentroop-containers' }}/opentroop-api:${{ github.sha }}
  BACKEND_IMAGE_LATEST: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}/${{ vars.GCP_ARTIFACT_REPOSITORY || vars.AR_REPO || 'opentroop-containers' }}/opentroop-api:latest
  FRONTEND_IMAGE: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}/${{ vars.GCP_ARTIFACT_REPOSITORY || vars.AR_REPO || 'opentroop-containers' }}/opentroop-web:${{ github.sha }}
  FRONTEND_IMAGE_LATEST: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}/${{ vars.GCP_ARTIFACT_REPOSITORY || vars.AR_REPO || 'opentroop-containers' }}/opentroop-web:latest

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    # These permissions are required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Production must target the Terraform/Scalr-provisioned services explicitly.
      # Without these, the env defaults below fall back to flat 'opentroop-*' names,
      # which deploy-cloudrun would happily CREATE as new, hand-managed services
      # alongside the Terraform-managed 'opentroop-<env>-*' ones (ADR 0009, #220).
      - name: Require explicit service targets in production
        if: github.ref == 'refs/heads/main'
        run: |
          missing=()
          [ -n "${{ vars.GCP_PROJECT_ID }}${{ vars.PROJECT_ID }}" ] || missing+=("GCP_PROJECT_ID")
          [ -n "${{ vars.GCP_API_SERVICE_NAME }}${{ vars.API_SERVICE_NAME }}" ] || missing+=("GCP_API_SERVICE_NAME")
          [ -n "${{ vars.GCP_WEB_SERVICE_NAME }}${{ vars.WEB_SERVICE_NAME }}" ] || missing+=("GCP_WEB_SERVICE_NAME")
          [ -n "${{ vars.GCP_ARTIFACT_REPOSITORY }}${{ vars.AR_REPO }}" ] || missing+=("GCP_ARTIFACT_REPOSITORY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Production deploy requires these GitHub Environment variables, set to the Terraform/Scalr-managed names (e.g. GCP_API_SERVICE_NAME=opentroop-prod-api). Refusing to fall back to flat 'opentroop-*' defaults that would create orphaned hand-managed services. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- BACKEND ---
      - name: Build Backend Image
        working-directory: ./backend
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }} -t ${{ env.BACKEND_IMAGE_LATEST }} .

      - name: Push Backend Image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}
          docker push ${{ env.BACKEND_IMAGE_LATEST }}

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.BACKEND_IMAGE }}
          flags: >-
            --allow-unauthenticated
            --port=8000

      # --- FRONTEND ---
      - name: Build Frontend Image
        # Note: Next.js build might require NEXT_PUBLIC_* args at build time
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-${{ steps.deploy-backend.outputs.url }}} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_CLERK_JWT_TEMPLATE=${{ vars.NEXT_PUBLIC_CLERK_JWT_TEMPLATE || secrets.NEXT_PUBLIC_CLERK_JWT_TEMPLATE }} \
            --build-arg NEXT_PUBLIC_TENANT_ID=${{ secrets.NEXT_PUBLIC_TENANT_ID }} \
            --build-arg NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN || vars.APP_DOMAIN || '' }} \
            -f apps/web/Dockerfile -t ${{ env.FRONTEND_IMAGE }} -t ${{ env.FRONTEND_IMAGE_LATEST }} .

      - name: Push Frontend Image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}
          docker push ${{ env.FRONTEND_IMAGE_LATEST }}

      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.WEB_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.FRONTEND_IMAGE }}
          flags: >-
            --allow-unauthenticated
            --port=3000

      - name: Deployment Summary
        run: |
          echo "Backend URL: ${{ steps.deploy-backend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend URL: ${{ steps.deploy-frontend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
