name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}
  REGION: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}
  AR_REPO: opentroop-containers
  BACKEND_IMAGE: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}/opentroop-containers/opentroop-api:${{ github.sha }}
  FRONTEND_IMAGE: ${{ vars.GCP_REGION || vars.REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || vars.PROJECT_ID || 'opentroop' }}/opentroop-containers/opentroop-web:${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    # These permissions are required for Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- BACKEND ---
      - name: Build Backend Image
        working-directory: ./backend
        run: docker build -t ${{ env.BACKEND_IMAGE }} .

      - name: Push Backend Image
        run: docker push ${{ env.BACKEND_IMAGE }}

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opentroop-api
          region: ${{ env.REGION }}
          image: ${{ env.BACKEND_IMAGE }}
          flags: >-
            --allow-unauthenticated
            --port=8000
          env_vars: |
            ENVIRONMENT=production
            AUTH_ISSUER=${{ secrets.AUTH_ISSUER }}
            AUTH_JWKS_URI=${{ secrets.AUTH_JWKS_URI }}
            AUTH_AUDIENCE=${{ secrets.AUTH_AUDIENCE }}
            APP_SECRET=${{ secrets.APP_SECRET }}
            APP_DOMAIN=${{ secrets.APP_DOMAIN }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_URL_ADMIN=${{ secrets.DATABASE_URL_ADMIN || secrets.DATABASE_URL }}
            DATABASE_URL_MIGRATE=${{ secrets.DATABASE_URL_MIGRATE || secrets.DATABASE_URL }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}

      # --- FRONTEND ---
      - name: Build Frontend Image
        # Note: Next.js build might require NEXT_PUBLIC_* args at build time
        run: docker build --build-arg NEXT_PUBLIC_API_URL=${{ steps.deploy-backend.outputs.url }} --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} --build-arg NEXT_PUBLIC_TENANT_ID=${{ secrets.NEXT_PUBLIC_TENANT_ID }} -f apps/web/Dockerfile -t ${{ env.FRONTEND_IMAGE }} .

      - name: Push Frontend Image
        run: docker push ${{ env.FRONTEND_IMAGE }}

      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opentroop-web
          region: ${{ env.REGION }}
          image: ${{ env.FRONTEND_IMAGE }}
          flags: >-
            --allow-unauthenticated
            --port=3000
          # Set API URL for the frontend to point to the backend we just deployed
          env_vars: |
            NEXT_PUBLIC_API_URL=${{ steps.deploy-backend.outputs.url }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_TENANT_ID=${{ secrets.NEXT_PUBLIC_TENANT_ID }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}

      - name: Deployment Summary
        run: |
          echo "Backend URL: ${{ steps.deploy-backend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend URL: ${{ steps.deploy-frontend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
