[project]
name = "opentroop-backend"
version = "0.1.0"
description = "OpenTroop backend - offline-first troop management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "uuid6>=2024.1.12",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.32",
    # Provides the IANA tz database for zoneinfo (TWH import timezone conversion)
    # on slim containers that lack a system tzdata package.
    "tzdata>=2024.1",
    # HTTP client used by ResendEmailBackend (app/core/notifications.py).
    "httpx2>=0.28",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "sqlalchemy[mypy]>=2.0",
    "pip-audit>=2.7",
    "faker>=25.0",
    "pytest-cov>=7.1.0",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-report=xml"
markers = [
    "pg: tests that require a live Postgres (set PG_TEST_URL to enable)",
]

[tool.coverage.run]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
# Third-party packages without stubs
ignore_missing_imports = true

[project.scripts]
provision-tenant       = "scripts.provision_tenant:main"
promote-platform-admin = "scripts.promote_platform_admin:main"
import-twh             = "scripts.import_twh:main"
reset-tenant     = "scripts.reset_tenant:main"
reset-db         = "scripts.reset_db:main"
link-admin       = "scripts.link_admin:main"
anonymize-twh    = "scripts.anonymize_twh:main"
export-openapi   = "scripts.export_openapi:main"
seed-dev-data    = "scripts.seed_dev_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
