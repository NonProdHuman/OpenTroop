repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        pass_filenames: false
        files: ^backend/
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        language: system
        entry: bash -c 'cd backend && uv run ruff format .'
        pass_filenames: false
        files: ^backend/
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        language: system
        entry: bash -c 'cd backend && uv run python -m mypy app'
        pass_filenames: false
        files: ^backend/
        types_or: [python, pyi]
      - id: tsc-web
        name: tsc (web)
        language: system
        entry: bash -c 'cd apps/web && pnpm exec tsc --noEmit'
        pass_filenames: false
        files: ^apps/web/
        types_or: [ts, tsx]
      - id: eslint-web
        name: eslint (web)
        language: system
        entry: bash -c 'cd apps/web && pnpm exec eslint src'
        pass_filenames: false
        files: ^apps/web/
        types_or: [ts, tsx]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0 # Ensure you are on a recent version supporting OpenTofu features
    hooks:
      - id: terraform_fmt
        name: opentofu_fmt  # Optional: Rename the UI string for clarity
        files: ^terraform/
        args:
          - --hook-config=--tf-path=tofu

      - id: terraform_validate
        name: opentofu_validate
        files: ^terraform/
        args:
          - --hook-config=--tf-path=tofu
          - --tf-init-args=-backend=false

      - id: terraform_tflint
        files: ^terraform/

      - id: terraform_trivy
        files: ^terraform/

      - id: terraform_docs
        files: ^terraform/
